{% block content %}
<div class="reset-complete-container">
  <div class="reset-complete-card">
    <div class="success-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
      </svg>
    </div>
    <h1 class="reset-complete-title">Password Reset Complete</h1>
    <p class="reset-complete-message">
      Your new password has been set successfully. You can now log in with your new credentials.
    </p>
    <a href="{% url 'login' %}" class="login-button">
      Continue to Login
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" d="M16.72 7.72a.75.75 0 011.06 0l3.75 3.75a.75.75 0 010 1.06l-3.75 3.75a.75.75 0 11-1.06-1.06l2.47-2.47H3a.75.75 0 010-1.5h16.19l-2.47-2.47a.75.75 0 010-1.06z" clip-rule="evenodd" />
      </svg>
    </a>
  </div>
</div>

<style>
  /* Base styles */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f8fafc;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #334155;
  }

  .reset-complete-container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }

  .reset-complete-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    padding: 40px;
    text-align: center;
  }

  /* Success icon */
  .success-icon {
    margin-bottom: 24px;
  }

  .success-icon svg {
    width: 64px;
    height: 64px;
    color: #10b981; /* Emerald green for success */
  }

  /* Text styles */
  .reset-complete-title {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #1e293b;
  }

  .reset-complete-message {
    color: #64748b;
    margin-bottom: 32px;
    font-size: 16px;
    line-height: 1.5;
  }

  /* Button styles */
  .login-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    background-color: rgb(0,0,0);
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 500;
    transition: background-color 0.2s;
  }

  .login-button:hover {
    background-color: #2563eb;
  }

  .login-button svg {
    width: 18px;
    height: 18px;
  }

  /* Responsive adjustments */
  @media (max-width: 480px) {
    .reset-complete-card {
      padding: 30px 20px;
    }
    
    .reset-complete-title {
      font-size: 20px;
    }
    
    .reset-complete-message {
      font-size: 15px;
    }
  }
</style>
{% endblock %}
