<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Product</title>
    {% load static %}
    <script src="https://unpkg.com/lucide@0.485.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="{% static 'products/add.css' %}" />
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <h1>ADD PRODUCT</h1>
        <form id="productForm" onsubmit="handleSubmit(event)" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <!-- Image Upload -->
          <div class="form-group">
            <label>Product Image</label>
            <div class="image-upload" onclick="document.getElementById('imageInput').click()">
              <i data-lucide="upload"></i>
              <input
                type="file"
                id="imageInput"
                name="imageInput"
                accept="image/*"
                style="display: none"
                onchange="handleImageChange(event)"
                required
              />
              <img id="imagePreview" alt="Preview" />
              <div class="upload-text">Upload a file</div>
              <div class="upload-hint">PNG, JPG, GIF up to 10MB</div>
            </div>
          </div>

          <!-- Product Name -->
          <div class="form-group">
            <label>
              <div class="label-icon">
                <i data-lucide="box"></i>
                Product Name
              </div>
            </label>
            <input type="text" required name="name" />
          </div>
          <div class="form-group">
            <label>
              <div class="label-icon">
                <i data-lucide="tag"></i>
                Category
              </div>
            </label>
            <select required name="category" class="cat">
              <option value="" disabled selected></option>
              <option value="Arts">Arts</option>
              <option value="Clothing-and-Footwear">Clothing-and-Footwear</option>
              <option value="Home Decor">Home Decor</option>
              <option value="Food">Food</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label>
              <div class="label-icon">
                <i data-lucide="file-text"></i>
                Description
              </div>
            </label>
            <textarea required name="description" rows="4"></textarea>
          </div>

          <!-- Company Name -->
          <div class="form-group">
            <label>
              <div class="label-icon">
                <i data-lucide="building-2"></i>
                Company Name
              </div>
            </label>
            <input type="text" required name="companyName" />
          </div>

          <!-- Price and Quantity -->
          <div class="grid grid-cols-2">
            <div class="form-group">
              <label>
                <div class="label-icon">
                  <i data-lucide="indian-rupee"></i>
                  Price
                </div>
              </label>
              <div class="price-input-container">
                <span>₹</span>
                <input type="number" required min="0" step="0.01" name="price" />
              </div>
            </div>

            <div class="form-group">
              <label>
                <div class="label-icon">
                  <i data-lucide="shopping-cart"></i>
                  Quantity
                </div>
              </label>
              <input type="number" required min="0" name="quantity" />
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit">Add Product</button>
        </form>
      </div>
    </div>

    <script>
      // Initialize Lucide icons
      lucide.createIcons();
    
      // Handle image upload
      function handleImageChange(event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const preview = document.getElementById('imagePreview');
            preview.src = e.target.result;
            preview.style.display = 'block';
            document.querySelector('.upload-text').style.display = 'none';
            document.querySelector('.upload-hint').style.display = 'none';
            document.querySelector('[data-lucide="upload"]').style.display = 'none';
          };
          reader.readAsDataURL(file);
        }
      }
    
      // Handle form submission
      function handleSubmit(event) {
        event.preventDefault();

        const form = event.target;
        const formData = new FormData(form);
        
        // Send Data to Django Backend
        fetch("/add-product/", {
          method: "POST",
          body: formData,
        })
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            alert("Error: " + data.error);
          } else {
            alert("Product added successfully!");
            resetForm();
          }
        })
        .catch(error => {
          console.error("Error:", error);
          alert("An error occurred while adding the product.");
        });
      }

      // Function to reset the form and file input
      function resetForm() {
        const form = document.getElementById('productForm');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadText = document.querySelector('.upload-text');
        const uploadHint = document.querySelector('.upload-hint');
        const uploadIcon = document.querySelector('[data-lucide="upload"]');

        form.reset();
        imageInput.value = ''; // Clear the file input
        imagePreview.src = '';
        imagePreview.style.display = 'none';
        uploadText.style.display = 'block';
        uploadHint.style.display = 'block';
        uploadIcon.style.display = 'block';
      }
    </script>
  </body>
</html>
