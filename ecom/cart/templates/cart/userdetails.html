<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Details</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'cart/userdetails.css' %}">
</head>
<body>
    <div class="container">
        <div class="details-card">
            <div class="card-header">
                <h1>Verify Your Details</h1>
                <p class="subtitle">Please confirm your information before proceeding to payment</p>
            </div>

            <form id="userDetailsForm" class="details-form">
                <div class="form-section">
                    <h2>Personal Information</h2>
                    <div class="form-grid">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="fullName">Full Name*</label>
                            <input type="text" id="fullName" name="fullName" 
                            value="{{ user.first_name|default:'' }}{{ user.last_name|default:'' }}" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number*</label>
                            <input type="tel" id="phone" name="phone" value="{{user.phone_number|default:''}}" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address*</label>
                            <input type="email" id="email" name="email" value="{{ user.email }}" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="alternatePhone">Alternate Phone</label>
                            <input type="tel" id="alternatePhone" name="alternatePhone">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Address Details</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="houseNo">House/Flat No.*</label>
                            <input type="text" id="houseNo" name="houseNo" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="street">Street/Area*</label>
                            <input type="text" id="street" name="street" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="landmark">Landmark</label>
                            <input type="text" id="landmark" name="landmark">
                        </div>
                        <div class="form-group">
                            <label for="pincode">PIN Code*</label>
                            <input type="text" id="pincode" name="pincode" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="state">State*</label>
                            <select id="state" name="state" required>
                                <option value="">Select State</option>
                            </select>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="district">District*</label>
                            <select id="district" name="district" required>
                                <option value="">Select District</option>
                            </select>
                            <span class="error-message"></span>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Additional Information</h2>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="addressType">Address Type*</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="addressType" value="home" checked>
                                    <span class="radio-text">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                                        Home
                                    </span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="addressType" value="work">
                                    <span class="radio-text">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4"/><line x1="12" x2="12" y1="4" y2="20"/><line x1="4" x2="20" y1="12" y2="12"/></svg>
                                        Work
                                    </span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="addressType" value="other">
                                    <span class="radio-text">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="16"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
                                        Other
                                    </span>
                                </label>
                            </div>
                        </div>
                        <div class="form-group full-width">
                            <label for="deliveryInstructions">Delivery Instructions (Optional)</label>
                            <textarea id="deliveryInstructions" name="deliveryInstructions" rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="secondary-button" id="backButton" onclick = window.location.href="{% url 'cart' %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 
                        Back to Cart
                    </button>
                    <button type="submit" class="primary-button" id="proceedButton" onsubmit="window.location.href='{% url 'payment' %}'"  >
                        Proceed to Payment
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('userDetailsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Collect all form data
            const formData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                houseNo: document.getElementById('houseNo').value,
                street: document.getElementById('street').value,
                landmark: document.getElementById('landmark').value,
                pincode: document.getElementById('pincode').value,
                state: document.getElementById('state').value,
                district: document.getElementById('district').value,
                addressType: document.querySelector('input[name="addressType"]:checked').value,
                deliveryInstructions: document.getElementById('deliveryInstructions').value
            };
        
            // Format delivery address
            const deliveryAddress = [
                formData.houseNo,
                formData.street,
                formData.landmark ? `Near ${formData.landmark}` : '',
                formData.district,
                formData.state,
                `PIN: ${formData.pincode}`,
                `(${formData.addressType} address)`,
                formData.deliveryInstructions ? `Instructions: ${formData.deliveryInstructions}` : ''
            ].filter(Boolean).join(', ');
        
            // Save to localStorage
            localStorage.setItem('orderDetails', JSON.stringify({
                user_name: formData.fullName,
                user_phone: formData.phone,
                user_email: formData.email,
                delivery_address: deliveryAddress,
                delivery_instructions: formData.deliveryInstructions
            }));
        
            // Redirect to payment page
            window.location.href = "{% url 'payment' %}";
        });
    </script>
    <script src="{% static 'cart/userdetails.js' %}"></script>
</body>
</html>
