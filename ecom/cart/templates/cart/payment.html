<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Checkout</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'cart/payment.css' %}">
</head>
<body>
    <div class="container">
        <div class="checkout-container">
            <!-- Order Summary Section -->
            <div class="order-summary">
                {% csrf_token %}
                <h2>Order Summary</h2>
                <div class="summary-items">
                    <div class="summary-item">
                        <span>Product Total</span>
                        <span>₹{{ total_price }}</span>
                    </div>
                    <div class="summary-item">
                        <span>Shipping</span>
                        <span>        
                            {% if total_price > 500 %}
                            ₹0.00
                            {% else %}
                            ₹20.00
                            {% endif %}
                        </span>
                    </div>
                    <div class="summary-item">
                        <span>Tax</span>
                        <span>₹{{ tax }}</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span>₹{{ total_payment }}</span>
                    </div>
                </div>
            </div>

            <!-- Payment Form Section -->
            <div class="payment-form">
                <h2>ENTER YOUR CARD DETAILS</h2>
                <div class="payment-methods">
                    <div class="payment-method-selector">
                        <label class="method-label">
                            <input type="radio" name="paymentMethod" value="card" checked>
                            <span class="method-content">
                                <svg class="credit-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                    <line x1="1" y1="10" x2="23" y2="10"></line>
                                </svg>
                            </span>
                        </label>
                       
                    </div>
                </div>

                <div id="cardPaymentForm">
                    <form id="paymentForm">
                        <div class="form-group">
                            <label for="cardNumber">Card Number</label>
                            <div class="input-wrapper">
                                <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="cardName">Cardholder Name</label>
                            <input type="text" id="cardName" placeholder="John Doe" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group half">
                                <label for="expiry">Expiry Date</label>
                                <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
                            </div>
                            <div class="form-group half">
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" placeholder="123" maxlength="3" required>
                            </div>
                        </div>

                        <button type="submit" class="pay-button">
                            Pay ₹{{ total_payment }}
                            <span class="lock-icon"></span>
                        </button>
                    </form>
                </div>

               
            </div>
        </div>
    </div>
    <!-- Success Modal -->
<div class="success-modal" id="successModal">
    <div class="success-content">
        <div class="success-animation">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>
        <h2>Payment Successful!</h2>
        <p>Your order has been processed successfully.</p>
        <button class="success-button" id="successButton" onclick = window.location.href="{% url 'home' %}">Continue Shopping</button>
    </div>
</div>
    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get order details from localStorage
            const orderDetails = JSON.parse(localStorage.getItem('orderDetails'));
            const totalAmount = parseFloat("{{ total_payment }}");
            
            // Prepare order data
            const orderData = {
                user_name: orderDetails.user_name,
                user_phone: orderDetails.user_phone,
                user_email: orderDetails.user_email,
                delivery_address: orderDetails.delivery_address,
                total_amount: totalAmount
            };
        
            // Send to server
            fetch('/create_order/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value,
                },
                body: JSON.stringify(orderData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Clear localStorage
                    localStorage.removeItem('orderDetails');
                } else {
                    console.log('Order placed: ');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Order processing failed');
            });
        });
    </script>
    <script src="{% static 'cart/payment.js' %}"></script>
</body>
</html>
